<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre e Termos de Uso - Autismo Questionário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #fff;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* Configuração do Body com Imagem de Fundo */
        body {  
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #020617;
            background-size: cover;
            color: var(--text-color);
            background-color: var(--bg-color);
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        :root {
            --bg-color: #020617;
            --surface-color: rgba(15, 23, 42, 0.6);
            --text-color: #e2e8f0;
            --accent-color: #00f3ff;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 243, 255, 0.2);
            --input-bg: rgba(0, 243, 255, 0.05);
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background-color: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 30px rgba(0, 243, 255, 0.1);
        }

        .navbar a {
            margin: 0 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .navbar a:hover {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        .navbar a.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        /* Botão de três pontinhos para dispositivos móveis */
        .menu-toggle {
            display: none;
            font-size: 32px;
            color: var(--accent-color);
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
            left: auto;
            background: none;
            border: none;
        }

        /* Menu suspenso para mobile */
        .menu-links {
            display: none;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 6, 23, 0.98);
            backdrop-filter: blur(10px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            opacity: 1;
            visibility: visible;
        }

        .menu-links a {
            padding: 15px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.5rem;
            text-align: center;
            border-bottom: none;
        }

        .menu-links a:hover {
            color: var(--accent-color);
        }

        /* Estilo para menu e botão no mobile */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px;
            }

            .navbar a {
                display: none;
            }

            .menu-toggle {
                display: block;
            }

            .menu-links.hidden {
                display: flex;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            .menu-links {
                display: flex;
            }
        }

        .close-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 40px;
            color: var(--accent-color);
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Seções */
        .section {
            max-width: 900px;
            margin: 100px auto 20px; /* Ajustei a margem superior para acomodar a navbar */
            padding: 30px;
            border-radius: 8px;
            background: var(--surface-color);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        /* Formulário */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        input, textarea {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
            font-family: inherit;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        textarea {
            resize: none;
            height: 120px;
        }

        input[type="submit"] {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 30px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        input[type="submit"]:hover {
            background-color: var(--accent-color);
            color: #000;
            box-shadow: 0 0 30px var(--accent-color);
        }

        input[type="submit"]:active {
            transform: scale(0.95);
        }

        /* Footer */
        .footer {
            background-color: rgba(2, 6, 23, 0.9);
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        .footer a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .section {
                margin: 90px 15px 20px;
                padding: 25px 15px;
            }

            input, textarea {
                font-size: 1em;
                padding: 10px;
            }

            input[type="submit"] {
                padding: 10px 20px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            .navbar a {
                font-size: 1em;
            }

            input, textarea {
                padding: 8px;
            }

            input[type="submit"] {
                width: 100%;
                padding: 12px;
                font-size: 0.9em;
            }
        }

        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html">Início</a>
        <a href="sugestao.html" class="active">Sugestão</a>
        <a href="servico.html">Serviços</a>
        <a href="questionario.html">Questionário</a>
        <a href="contato.html">Contato</a>
        <a href="fotostcc.html">Fotos tcc</a>

        <!-- Botão de três pontinhos para dispositivos móveis -->
        <button class="menu-toggle" onclick="toggleMenu()">&#9776;</button>
    </nav>

    <!-- Menu suspenso para dispositivos móveis -->
    <div class="menu-links hidden">
        <button class="close-menu" onclick="toggleMenu()">&times;</button>
        <a href="index.html">Início</a>
        <a href="sugestao.html">Sugestão</a>
        <a href="servico.html">Serviços</a>
        <a href="questionario.html">Questionário</a>
        <a href="contato.html">Contato</a>
        <a href="fotostcc.html">Fotos tcc</a>
    </div>

    <!-- Sugestão -->
    <div class="section">
        <h2>Deixe sua Sugestão</h2>
        <!-- Formulário redirecionando para agradecimento.html -->
        <form action="agradecimento.html" method="post">
            <input type="text" name="nome" placeholder="Seu Nome" required>
            <input type="email" name="email" placeholder="Seu Email" required>
            <textarea name="sugestao" placeholder="Sua Sugestão" required></textarea>
            <input type="submit" value="Enviar Sugestão">
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2024 Autismo Questionário. Todos os direitos reservados.</p>
        <p><a href="politica-privacidade.html">Política de Privacidade</a> | <a href="termos-uso.html">Termos de Uso</a></p>
    </div>

    <script>
        // Alterna o menu de navegação no mobile
        function toggleMenu() {
            const menu = document.querySelector('.menu-links');
            menu.classList.toggle('hidden'); // Alterna a classe que esconde/exibe o menu
        }
    </script>
</body>
</html>
